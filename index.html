<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />

<title>PyMaster UZ - Python Akademiyasi va Amaliy Loyihalar</title>

<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --em:#059669; --em-d:#047857; --em-l:#ecfdf5; --teal:#0d9488; --amber:#d97706;
    --dark:#0f172a; --dark2:#1e293b; --radius:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}
  h1,h2,h3{line-height:1.25;margin:0 0 .5em}
  p{margin:0 0 1em}
  .container{max-width:1180px;margin:0 auto;padding:0 20px;width:100%}
  .narrow{max-width:860px;margin:0 auto;padding:0 20px;width:100%}
  main{flex:1;padding:28px 0 60px}
  [hidden]{display:none !important}

  /* ---------- Header ---------- */
  header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;white-space:nowrap}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--em),var(--teal));display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 6px 16px rgba(5,150,105,.3)}
  .brand small{display:block;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.3px}
  nav.menu{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
  nav.menu::-webkit-scrollbar{display:none}
  nav.menu a{padding:8px 12px;border-radius:10px;font-size:14px;font-weight:500;color:#475569;white-space:nowrap;transition:.2s}
  nav.menu a:hover{background:#f1f5f9;color:var(--text)}
  nav.menu a.active{background:#e2e8f0;color:var(--text);font-weight:700}
  .xp{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:var(--em-l);border:1px solid #a7f3d0;color:#065f46;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}

  /* ---------- Shared UI ---------- */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:0;background:var(--em);color:#fff;font-weight:600;font-size:14px;transition:.2s;box-shadow:0 4px 14px rgba(5,150,105,.25)}
  .btn:hover{background:var(--em-d);transform:translateY(-1px)}
  .btn:disabled{opacity:.55;cursor:default;transform:none}
  .btn.dark{background:var(--dark2);box-shadow:none}
  .btn.dark:hover{background:#334155}
  .btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border);box-shadow:none}
  .btn.ghost:hover{background:#f8fafc}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:.2s}
  .card.click{cursor:pointer}
  .card.click:hover{box-shadow:0 10px 25px rgba(15,23,42,.08);transform:translateY(-2px)}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--em-l);color:#047857}
  .badge.b{background:#ccfbf1;color:#0f766e}
  .badge.a{background:#fef3c7;color:#b45309}
  .badge.r{background:#fee2e2;color:#b91c1c}
  .muted{color:var(--muted)}
  .section-title{text-align:center;max-width:680px;margin:0 auto 32px}
  .section-title h2{font-size:clamp(24px,3vw,32px);margin-bottom:8px}
  .grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .progress{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:12px}
  .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--teal));border-radius:999px;transition:width .4s}
  .back{display:inline-flex;gap:6px;color:#475569;font-weight:600;font-size:14px;margin-bottom:16px}
  .back:hover{color:var(--text)}
  .page-head{margin-bottom:24px}
  .page-head h1{font-size:clamp(26px,3.5vw,36px);margin-bottom:6px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
  .label{font-size:13px;font-weight:700;color:#334155;margin:18px 0 8px;display:block}
  h3.sec{font-size:17px;margin:24px 0 10px}

  pre.code,pre.output{background:var(--dark);color:#6ee7b7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;padding:16px 18px;border-radius:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
  pre.output{color:#e2e8f0;min-height:60px}
  textarea.editor{width:100%;min-height:220px;resize:vertical;background:#0b1220;color:#a7f3d0;border:1px solid #1e293b;border-radius:12px;padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;outline:none;tab-size:4}
  textarea.editor:focus{border-color:var(--em)}
  textarea.area{width:100%;min-height:100px;border:1px solid var(--border);border-radius:12px;padding:12px;outline:none;background:#fff}
  input.text{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;outline:none;background:#fff}
  input.text:focus{border-color:var(--em);box-shadow:0 0 0 3px rgba(5,150,105,.15)}
  iframe.preview{width:100%;height:340px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-top:12px}
  .hint{margin-top:12px;padding:12px 14px;border-radius:10px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:14px}
  .output-wrap{margin-top:12px}
  .output-wrap .label{margin-top:0}

  /* ---------- Hero ---------- */
  .hero{margin:0 20px;border-radius:28px;background:radial-gradient(ellipse at top right,rgba(16,185,129,.25),transparent 60%),linear-gradient(180deg,var(--dark),#020617);color:#fff;padding:72px 24px 56px;text-align:center;box-shadow:0 25px 50px -12px rgba(15,23,42,.35)}
  .hero-in{max-width:820px;margin:0 auto}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.35);color:#34d399;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .hero h1{font-size:clamp(34px,6vw,60px);font-weight:900;letter-spacing:-.02em;margin:22px 0 18px}
  .grad{background:linear-gradient(90deg,#34d399,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p.lead{color:#cbd5e1;font-size:clamp(16px,2vw,19px);max-width:640px;margin:0 auto 30px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:56px;padding-top:32px;border-top:1px solid rgba(148,163,184,.2)}
  .stats b{display:block;font-size:clamp(22px,3vw,32px);font-weight:800}
  .stats span{font-size:12px;color:#94a3b8}
  .c-em{color:#34d399}.c-teal{color:#2dd4bf}.c-cy{color:#22d3ee}.c-am{color:#fbbf24}
  .feature{cursor:pointer}
  .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;margin-bottom:18px}
  .promo{display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,#ecfdf5,#f0fdfa);border:1px solid #a7f3d0;border-radius:24px;padding:36px}
  .promo h2{font-size:clamp(22px,3vw,30px);margin:12px 0}

  /* ---------- Courses ---------- */
  .mod-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .mod-card h3{font-size:19px;margin-bottom:8px}
  .lesson-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:10px;transition:.15s;cursor:pointer}
  .lesson-row:hover{border-color:#6ee7b7;background:#f0fdf4}
  .lesson-row .t{font-weight:600;font-size:15px}
  .lesson-row .d{font-size:12px;color:var(--muted)}
  .done{color:var(--em);font-weight:700;font-size:13px;white-space:nowrap}
  .lesson-card h2{font-size:24px;margin-bottom:6px}
  .lesson-card h3.sec{color:var(--text)}
  .quiz-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff}
  .quiz-opt:hover{border-color:#6ee7b7}
  .quiz-opt input{accent-color:var(--em)}
  .q-ok{color:var(--em);font-weight:700}
  .q-bad{color:#dc2626;font-weight:700}

  /* ---------- IDE ---------- */
  .tabs{display:inline-flex;gap:4px;background:#f1f5f9;border:1px solid var(--border);padding:4px;border-radius:12px}
  .tabs button{border:0;background:transparent;padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;color:#475569}
  .tabs button.on{background:var(--em);color:#fff;box-shadow:0 2px 8px rgba(5,150,105,.25)}
  .ide-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:860px){.ide-grid{grid-template-columns:1fr}}
  .ide-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  select.sel{padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;outline:none}
  .out-title{font-size:13px;font-weight:700;color:#475569;margin:0 0 8px}

  /* ---------- Projects ---------- */
  .proj h3{font-size:19px;margin:12px 0 8px}
  .proj-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--em);font-weight:600;font-size:14px}
  .diff-Oson{background:#dcfce7;color:#15803d}
  .diff-O{background:#fef3c7;color:#b45309}
  .diff-Q{background:#fee2e2;color:#b91c1c}
  .checklist{list-style:none;padding:0;margin:0}
  .checklist li{display:flex;gap:10px;align-items:center;padding:6px 0;color:#334155;font-size:15px}
  .checklist li::before{content:"✓";display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--em-l);color:var(--em);font-weight:800;font-size:12px;flex-shrink:0}
  .steps{display:grid;gap:8px}
  .steps div{padding:11px 14px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;font-size:14px;font-weight:500}

  /* ---------- AI / FAQ ---------- */
  details.faq{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:12px}
  details.faq summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
  details.faq summary::after{content:"+";font-size:22px;color:var(--em);font-weight:500}
  details.faq[open] summary::after{content:"−"}
  details.faq p{margin:12px 0 0;color:#475569}

  /* ---------- Profile ---------- */
  .stat-box{text-align:center;padding:22px}
  .stat-box b{display:block;font-size:30px;color:var(--em)}
  .avatar{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--em),var(--teal));color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.75);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
  .modal{background:#fff;border-radius:24px;padding:32px;max-width:420px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.35)}
  .modal .ico-c{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--em),var(--teal));color:#fff;display:grid;place-items:center;font-size:26px;margin:0 auto 14px}

  /* ---------- Toast ---------- */
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--dark);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3);transition:transform .35s;z-index:200;max-width:90vw;text-align:center}
  #toast.show{transform:translate(-50%,0)}

  /* ---------- Footer ---------- */
  footer{background:#fff;border-top:1px solid var(--border);padding:28px 0;margin-top:40px}
  .foot{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .foot nav{display:flex;gap:18px;flex-wrap:wrap}
  .foot a:hover{color:var(--text)}

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    .top-in{flex-wrap:wrap;gap:10px;padding:10px 16px}
    nav.menu{order:3;width:100%;justify-content:flex-start}
    .stats{grid-template-columns:repeat(2,1fr)}
    .hero{margin:0 12px;padding:52px 18px 40px;border-radius:22px}
  }
  @media (max-width:520px){
    .brand small{display:none}
    .xp{padding:6px 9px;font-size:12px}
    .card{padding:18px}
    .promo{padding:24px}
  }
</style>
</head>

<header class="top">
  <div class="top-in">
    <a href="#home" class="brand">
      <span class="logo">🐍</span>
      <span>PyMaster <span class="c-em">UZ</span><small>Python Akademiyasi</small></span>

    <nav class="menu">

<footer>

<script>
/* =========================================================
   DATA
   ========================================================= */
const PY_TOPICS = [
  "Python ga kirish va o'rnatish","Birinchi print() dasturi","O'zgaruvchilar va ma'lumot turlari",
  "Sonlar va arifmetik amallar","Matnlar (Strings) va metodlar","Foydalanuvchidan ma'lumot olish (input)",
  "Mantiqiy solishtiruvlar","If-elif-else shart operatorlari","And, or, not mantiqiy operatorlari",
  "For sikli va range()","While sikli va cheksiz tsikllar","Break va continue operatorlari",
  "Ro'yxatlar (Lists) asoslari","List metodlari va indekslash","Kortejlar (Tuples)",
  "Lug'atlar (Dictionaries)","To'plamlar (Sets)","Funksiya yaratish (def)",
  "Funksiya argumentlari va return","Lambda anonim funksiyalar","Global va lokal o'zgaruvchilar",
  "Modullar va import","Math va random kutubxonalari","Xatoliklar bilan ishlash (Try-Except)",
  "Fayllarni ochish va o'qish (open)","Faylga yozish va qo'shish","Klasslar va obyektlar (OOP)",
  "OOP Vorislik (Inheritance)","JSON ma'lumotlar bilan ishlash","Amaliy yakuniy loyiha"
];
const HTML_TOPICS = [
  "HTML nima va asosiy tushunchalar","HTML sahifa tuzilishi (DOCTYPE)","Sarlavhalar (h1-h6)",
  "Paragraflar va matn formatlash","Rasmlar qo'shish (img)","Havolalar va giperhavolalar (a)",
  "Ro'yxatlar (ul, ol, li)","Jadvallar yaratish (table, tr, td)","Forma va input elementlari",
  "Matn maydonlari va textarea","Tugmalar (button) va turlari","Semantik teglar (header, footer)",
  "Navigatsiya tegi (nav)","Bo'limlar (section, article)","Div va span konteynerlari",
  "Audio va video elementlari","Iframe orqali sahifa ulash","Meta teglar va SEO asoslari",
  "Favicon va sarlavha sozlamalari","HTML atributlari","ID va Class farqlari",
  "Blok va inline elementlar","Forma validatsiyasi","SVG rasmlar bilan ishlash",
  "Dastlabki veb sahifa yaratish","Aksessuarlik (Accessibility)","Global atributlar",
  "Data atributlari","HTML5 yangi imkoniyatlari","Loyihani yakunlash"
];
const CSS_TOPICS = [
  "CSS ga kirish va ulanish turlari","CSS selektorlari (Element, Class, ID)","Ranglar va o'lchov birliklari",
  "Shriftlar va matn dizayni","CSS Box Model (Margin, Padding, Border)","Fon (Background) xossalari",
  "Display xossasi (block, inline)","Position xossalari (relative, absolute)","Fixed va sticky joylashuv",
  "Float va Clear","Flexbox asoslari (display: flex)","Flexbox yo'nalishi va o'qi",
  "Flexbox justify va align","Flexbox wrap va gap","CSS Grid asoslari (display: grid)",
  "Grid ustunlar va qatorlar","Grid Template Areas","CSS O'tishlar (Transitions)",
  "CSS Transform (Rotate, Scale)","CSS Animatsiyalar (Keyframes)","Media Queries (Responsive)",
  "Pseudo-classes (:hover, :focus)","Pseudo-elements (::before, ::after)","CSS Variables (O'zgaruvchilar)",
  "Shadow (Soyalar: box-shadow, text-shadow)","Z-index va qatlamlar tartibi","Overflow xossalari",
  "CSS Cursor va ko'rsatgichlar","Normalize va Reset CSS","Yakuniy CSS Portfolio Loyihasi"
];
const JS_TOPICS = [
  "JavaScript ga kirish va konsol","O'zgaruvchilar (let, const, var)","Ma'lumot turlari (Primitivlar)",
  "Arifmetik va solishtiruv amallari","Shart operatorlari (if-else)","Switch-case operatori",
  "Ternary operator","Funksiyalar (Function Declaration)","Funksiya expression va arrow",
  "Massivlar (Arrays) asoslari","Massiv metodlari (push, pop, map)","Massiv filter va reduce",
  "Obyektlar (Objects) yaratish","Obyekt metodlari va this","For va While sikllari",
  "For...of va For...in sikllari","DOM tushunchasi va tanlash","Elementlarni o'zgartirish (innerHTML)",
  "CSS ni JS orqali boshqarish","Hodisalar (Event Listeners: click)","Input va klaviatura hodisalari",
  "Forma ma'lumotlarini olish","Local Storage bilan ishlash","Asinxron JavaScript (Timeout)",
  "Va'dalar (Promises) asoslari","Async / Await sintaksisi","Fetch API orqali ma'lumot olish",
  "Xatoliklarni tutish (try...catch)","Array va Object destrukturizatsiya","Yakuniy JavaScript Dastur"
];

// Har bir modul darslari shu yerda avtomatik yaratiladi
function makeLessons(prefix, topics, lang){
  return topics.map((t, i) => {
    const n = i + 1;
    let code, solution, starter;
    if (lang === 'python') {
      code = `# ${t} bo'yicha namuna kod\ndef demo_${n}():\n    print("${t} darsi bajarildi!")\n\ndemo_${n}()`;
      starter = `# ${t} uchun kod\n`;
      solution = `print("${t} bajarildi")`;
    } else if (lang === 'html') {
      code = `<!-- ${t} bo'yicha namuna -->\n<section>\n  <h2>${t}</h2>\n  <p>Dars muvaffaqiyatli bajarildi!</p>\n</section>`;
      starter = `<!-- ${t} uchun kod -->\n`;
      solution = `<h2>${t}</h2>\n<p>Dars bajarildi</p>`;
    } else if (lang === 'css') {
      code = `/* ${t} bo'yicha namuna */\n.demo-${n} {\n  color: #059669;\n  padding: 16px;\n  border-radius: 12px;\n  background: #ecfdf5;\n}`;
      starter = `/* ${t} uchun CSS */\n`;
      solution = `.box {\n  color: #059669;\n  padding: 16px;\n}`;
    } else {
      code = `// ${t} bo'yicha namuna\nfunction demo${n}() {\n  console.log("${t} darsi bajarildi!");\n}\ndemo${n}();`;
      starter = `// ${t} uchun kod\n`;
      solution = `console.log("${t} bajarildi");`;
    }
    return {
      id: `${prefix}-les-${n}`,
      title: `${n}. ${t}`,

const KEYS = { user: 'pymaster_user', xp: 'pymaster_xp', lessons: 'pymaster_lessons', projects: 'pymaster_projects' };

  user: loadKey(KEYS.user, null),
  xp: loadKey(KEYS.xp, 0),

};
function persist() {
  try {
    localStorage.setItem(KEYS.user, JSON.stringify(state.user));

    localStorage.setItem(KEYS.lessons, JSON.stringify(state.lessons));
    localStorage.setItem(KEYS.projects, JSON.stringify(state.projects));
  } catch (e) { /* localStorage mavjud bo'lmasa, sayt ishlashda davom etadi */ }

}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function copyText(text) {
  const done = () => toast('Kod nusxalandi');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => toast('Nusxalab bo\'lmadi'));
  else toast('Nusxalab bo\'lmadi');
}
function levelOf(xp) { return Math.floor(xp / 500) + 1; }
function modProgress(mod) {
  const done = mod.lessons.filter(l => state.lessons.includes(l.id)).length;
  return { done, total: mod.lessons.length, pct: Math.round(done / mod.lessons.length * 100) };
}
function totalLessons() { return MODULES.reduce((s, m) => s + m.lessons.length, 0); }

/* =========================================================
   CODE RUNNERS (Python: Pyodide, JS: sandbox, HTML/CSS: iframe)
   ========================================================= */
let pyPromise = null;
function getPy() {
  if (!pyPromise) {
    pyPromise = (async () => {
      if (!window.loadPyodide) throw new Error("Python muhiti yuklanmadi. Internet aloqasini tekshiring.");
      const py = await window.loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
      return py;
    })();
    pyPromise.catch(() => { pyPromise = null; });
  }
  return pyPromise;
}
async function runPython(code) {
  const py = await getPy();
  py.runPython("import sys, io\nsys.stdout = io.StringIO()\nsys.stderr = sys.stdout");
  let err = '';
  try { await py.runPythonAsync(code); }
  catch (e) { err = String(e.message || e).trim().split('\n').slice(-3).join('\n'); }
  const out = py.runPython("sys.stdout.getvalue()");
  return (out + (err ? (out ? '\n' : '') + 'Xatolik:\n' + err : '')) || "Kod bajarildi (chiqish yo'q).";
}
function runJS(code) {
  const logs = [];
  const orig = console.log;
  console.log = (...a) => logs.push(a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' '));
  try { new Function(code)(); }
  catch (e) { logs.push('Xatolik: ' + e.message); }
  finally { console.log = orig; }
  return logs.join('\n') || "Kod bajarildi (chiqish yo'q).";
}
async function execCode(lang, code, outId, frameId) {
  const out = $(outId), frame = frameId ? $(frameId) : null;
  if (frame) { frame.hidden = true; frame.srcdoc = ''; }
  out.hidden = false;
  if (lang === 'html' || lang === 'css') {
    out.hidden = true;
    frame.hidden = false;
    frame.srcdoc = lang === 'css'
      ? `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${code}</style></head><body style="font-family:sans-serif;padding:20px"><div class="box demo-1">Salom, CSS!</div><h2>Sarlavha</h2><p>Paragraf matni</p><button>Tugma</button></body></html>`
      : code;
    return;
  }
  if (lang === 'python') {
    out.textContent = 'Python muhiti yuklanmoqda (birinchi marta biroz vaqt oladi)...';
    try { out.textContent = await runPython(code); }
    catch (e) { out.textContent = 'Xatolik: ' + e.message; }
    return;
  }
  out.textContent = runJS(code);
}

        <p class="muted">Python, HTML/CSS yoki JavaScript kodini yozing va natijani darhol ko'ring.</p>
      </div>
      <div class="tabs">
        <button id="tab-python" class="on" onclick="setIdeLang('python')">🐍 Python</button>
        <button id="tab-web" onclick="setIdeLang('web')">🌐 HTML / CSS / JS</button>
      </div>
    </div>
    <div class="ide-grid">
      <div class="card">
        <div class="ide-bar">
          <select id="preset" class="sel" onchange="loadPreset()"></select>
          <div class="row">
            <button class="btn sm ghost" onclick="copyText($('ide-code').value)">📋 Nusxalash</button>
            <button class="btn sm dark" onclick="$('ide-code').value=currentPresets()[0].code;loadPreset(true)">↺ Tozalash</button>
            <button class="btn sm" onclick="runIde()">▶ Ishga tushirish</button>
          </div>
        </div>
        <textarea id="ide-code" class="editor" style="min-height:360px" spellcheck="false"></textarea>
      </div>
      <div class="card">
        <p class="out-title">Natija</p>
        <pre id="ide-out" class="output" style="min-height:360px">Kodni ishga tushiring...</pre>
        <iframe id="ide-frame" class="preview" style="height:360px" sandbox="allow-scripts" hidden></iframe>
      </div>
    </div>
  </div>`;
}

const IDE_PRESETS = {
  python: [
    { name: "1. Salom dunyo", code: `print("Salom, PyMaster UZ!")\nism = "Python O'quvchisi"\nprint(f"Xush kelibsiz, {ism}!")` },
    { name: "2. Fibonacci", code: `def fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        print(a, end=" ")\n        a, b = b, a + b\n\nfib(10)` },
    { name: "3. Ro'yxatlar", code: `sonlar = [3, 7, 1, 9, 4]\nprint("Eng katta:", max(sonlar))\nprint("Saralangan:", sorted(sonlar))\nprint("Juft sonlar:", [x for x in sonlar if x % 2 == 0])` }
  ],
  web: [
    { name: "1. Salom sahifa", code: `<!DOCTYPE html>\n<html>\n  <head>\n    <style>\n      body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }\n      .card { background: #1e293b; padding: 30px; border-radius: 16px; text-align: center; }\n      h1 { color: #34d399; }\n      button { background: #059669; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }\n    </style>\n  </head>\n  <body>\n    <div class="card">\n      <h1>Salom, PyMaster UZ!</h1>\n      <p>HTML, CSS va JavaScript jonli muhiti</p>\n      <button onclick="alert('Ishladi!')">Bosing</button>\n    </div>\n  </body>\n</html>` },
    { name: "2. JavaScript hisoblagich", code: `<!DOCTYPE html>\n<html>\n  <body style="font-family:sans-serif;text-align:center;padding:40px">\n    <h2>Hisoblagich: <span id="n">0</span></h2>\n    <button id="btn">+1</button>\n    <script>\n      let n = 0;\n      document.getElementById("btn").addEventListener("click", () => {\n        n++;\n        document.getElementById("n").textContent = n;\n      });\n    <\/script>\n  </body>\n</html>` }
  ]
};
let ideLang = 'python';
function currentPresets() { return IDE_PRESETS[ideLang]; }
function setIdeLang(l) {
  ideLang = l;
  $('tab-python').classList.toggle('on', l === 'python');
  $('tab-web').classList.toggle('on', l === 'web');
  const sel = $('preset');
  sel.innerHTML = currentPresets().map((p, i) => `<option value="${i}">${esc(p.name)}</option>`).join('');
  loadPreset(true);
}
function loadPreset(force) {
  const i = Number($('preset').value || 0);
  const code = currentPresets()[i].code;
  if (force || $('ide-code').dataset.preset !== String(i)) {
    $('ide-code').value = code;
    $('ide-code').dataset.preset = String(i);
    if (force) { $('ide-out').hidden = false; $('ide-frame').hidden = true; $('ide-out').textContent = 'Kodni ishga tushiring...'; }
  }
}
function runIde() {
  const code = $('ide-code').value;
  if (ideLang === 'web') {
    $('ide-out').hidden = true;
    $('ide-frame').hidden = false;
    $('ide-frame').srcdoc = code;
  } else {
    execCode('python', code, 'ide-out', null);
  }
}

    <div class="grid">
      ${PROJECTS.map(p => {

}

          <div class="row" style="gap:8px;margin-bottom:6px">

        <button class="btn ghost" onclick="$('p-code').value=PROJECTS.find(x=>x.id==='${p.id}').solutionCode">👀 Tayyor yechim</button>

}

  const u = state.user || { firstName: 'Mehmon', lastName: '' };
  const lvl = levelOf(state.xp);

      <div class="card stat-box"><b>${state.projects.length}<small style="font-size:16px;color:var(--muted)"> / ${PROJECTS.length}</small></b><span class="muted">Loyihalar</span></div>

      <div class="btn-row" style="justify-content:space-between">

function notFound() {
  return `<div class="narrow card" style="text-align:center"><h2>Sahifa topilmadi</h2><a class="btn" href="#home">Bosh sahifaga</a></div>`;
}

/* =========================================================
   ACTIONS
   ========================================================= */
function runExercise(lang, codeId = 'ex-code', outId = 'ex-out', frameId = 'ex-frame') {
  execCode(lang, $(codeId).value, outId, frameId);
}

function completeLesson(modId, idx) {
  const mod = MODULES.find(m => m.id === modId);
  const les = mod.lessons[idx];
  if (state.lessons.includes(les.id)) return;
  state.lessons.push(les.id);
  state.xp += 50;
  persist();
  const btn = $('done-btn');
  btn.disabled = true;
  btn.textContent = '✓ Tugatilgan';
  toast("Tabriklaymiz! Dars tugatildi va +50 XP qo'shildi");
}

function finishProject(id) {
  if (state.projects.includes(id)) return;
  const p = PROJECTS.find(x => x.id === id);
  state.projects.push(id);
  state.xp += 150;
  persist();
  toast(`Tabriklaymiz! "${p.title}" loyihasi topshirildi (+150 XP)`);
  render();
}

function checkQuiz(modId) {
  const mod = MODULES.find(m => m.id === modId);
  let score = 0;
  mod.quiz.forEach((q, qi) => {
    const chosen = document.querySelector(`input[name="q${qi}"]:checked`);
    const box = $(`qr-${qi}`);
    const ok = chosen && Number(chosen.value) === q.correctIndex;
    if (ok) score++;
    box.innerHTML = ok
      ? `<span class="q-ok">✓ To'g'ri!</span> ${esc(q.explanation)}`
      : `<span class="q-bad">✗ Noto'g'ri.</span> To'g'ri javob: <b>${esc(q.options[q.correctIndex])}</b>. ${esc(q.explanation)}`;
  });
  toast(`Natija: ${score} / ${mod.quiz.length}`);
}

function saveProfile() {
  const f = $('pf-first').value.trim(), l = $('pf-last').value.trim();
  if (!f) { toast('Ismni kiriting'); return; }
  state.user = { firstName: f, lastName: l };
  persist();
  toast('Ma\'lumotlar saqlandi');
  render();
}

function resetAll() {
  if (!confirm("Barcha ma'lumotlar (XP, darslar, loyihalar) o'chiriladi. Davom etasizmi?")) return;
  state.user = null; state.xp = 0; state.lessons = []; state.projects = [];
  Object.values(KEYS).forEach(k => localStorage.removeItem(k));
  persist();
  render();
  showRegister();
}

function showRegister() {
  $('modal-root').innerHTML = `
  <div class="overlay">
    <form class="modal" onsubmit="event.preventDefault();registerUser(this)">
      <div style="text-align:center;margin-bottom:18px">
        <div class="ico-c">🐍</div>
        <h2 style="font-size:22px;margin-bottom:6px">PyMaster UZ ga xush kelibsiz!</h2>
        <p class="muted" style="font-size:14px;margin:0">O'qishni boshlash uchun ism va familiyangizni kiriting.</p>
      </div>
      <label class="label">Ism</label>
      <input name="first" class="text" required placeholder="Masalan: Aziz" autocomplete="given-name">
      <label class="label">Familiya</label>
      <input name="last" class="text" required placeholder="Masalan: Karimov" autocomplete="family-name">
      <button class="btn" style="width:100%;justify-content:center;margin-top:22px" type="submit">Boshlash</button>
    </form>
  </div>`;
}
function registerUser(form) {
  const f = form.first.value.trim(), l = form.last.value.trim();
  if (!f || !l) return;
  state.user = { firstName: f, lastName: l };
  persist();
  $('modal-root').innerHTML = '';
  render();
}

/* =========================================================
   ROUTER
   ========================================================= */
function render() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const view = parts[0] || 'home';
  document.querySelectorAll('nav.menu a').forEach(a => {
    a.classList.toggle('active', a.dataset.nav === view);
  });

  let html = '';
  switch (view) {
    case 'home': html = homeView(); break;
    case 'courses':
      if (!parts[1]) html = coursesView();
      else if (parts[2] === 'quiz') html = quizView(parts[1]);
      else if (parts[2] !== undefined) html = lessonView(parts[1], Number(parts[2]));
      else html = moduleView(parts[1]);
      break;
    case 'ide': html = ideView(); break;
    case 'projects': html = parts[1] ? projectView(parts[1]) : projectsView(); break;
    case 'ustoz': html = ustozView(); break;
    case 'profile': html = profileView(); break;
    default: html = homeView();
  }
  $('main').innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'instant' });

  if (view === 'ide') { setIdeLang('python'); }
  $('xp-val').textContent = state.xp;
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  persist();
  render();
  if (!state.user) showRegister();
});
</script>
